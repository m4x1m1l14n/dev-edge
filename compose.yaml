# dev-edge: one Traefik per machine that gives every local project trusted HTTPS on
# https://<anything>.localhost. Managed by bin/dev-edge; do not run docker compose on it directly
# (the CLI provides the ports and state paths below).

name: dev-edge

services:
  traefik:
    image: traefik:v3.7.17
    container_name: dev-edge
    restart: unless-stopped
    command:
      # Same port inside and outside the container, so redirects and absolute URLs carry the
      # port the browser actually uses.
      - --entrypoints.web.address=:${EDGE_HTTP_PORT:?}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:${EDGE_HTTPS_PORT:?}
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/dev-edge/dynamic
      - --providers.file.watch=true
      - --api.dashboard=true
      - --log.level=WARN
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      # Loopback only: local development must not be reachable from the network.
      - "127.0.0.1:${EDGE_HTTP_PORT}:${EDGE_HTTP_PORT}"
      - "127.0.0.1:${EDGE_HTTPS_PORT}:${EDGE_HTTPS_PORT}"
      - "[::1]:${EDGE_HTTP_PORT}:${EDGE_HTTP_PORT}"
      - "[::1]:${EDGE_HTTPS_PORT}:${EDGE_HTTPS_PORT}"
    extra_hosts:
      # Lets file-provider routes reach processes running on the host. Docker Desktop defines this
      # name already; Linux Docker Engine needs it spelled out.
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-edge-dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dev-edge-dashboard.service=api@internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DEV_EDGE_STATE:?}/certs:/etc/dev-edge/certs:ro
      - ${DEV_EDGE_STATE:?}/dynamic:/etc/dev-edge/dynamic:ro
